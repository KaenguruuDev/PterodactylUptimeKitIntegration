name: Release Blueprint extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp conf.yml for packaging
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          sed -E -i \
            "s/^([[:space:]]*version:)[[:space:]].*/\1 \"${VERSION}\"/" \
            conf.yml

          grep -n "version:" conf.yml

      - name: Export Blueprint package
        id: export
        uses: zephrynis/blueprint-export@v1.0.0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.export.outputs.file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
